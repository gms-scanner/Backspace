buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.+' }
}
apply plugin: 'net.minecraftforge.gradle'

group = 'example.backspace'
version = '1.0.0'
archivesBaseName = 'backspace-hello-addon'
sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    compileOnly files('../../build/libs/backspace-dev-4.3.0-rc1.jar')
}
