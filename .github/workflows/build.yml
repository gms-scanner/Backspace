name: Build Backspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Fetch pinned OneConfig compile dependency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs | Out-Null
          $url = 'https://repo.polyfrost.org/releases/cc/polyfrost/oneconfig-1.12.2-forge/0.2.2-alpha230/oneconfig-1.12.2-forge-0.2.2-alpha230-full.jar'
          $jar = 'libs/OneConfig-1.12.2-forge.jar'
          Invoke-WebRequest -Uri $url -OutFile $jar
          $actual = (Get-FileHash $jar -Algorithm SHA256).Hash
          if ($actual -ne 'E8DA29639341204DA12B5F7D78C2B8434EAC97A751F1808906114AF44BF204AF') {
            throw "Unexpected OneConfig checksum: $actual"
          }

      - name: Build release jar and check CrystalAura
        shell: pwsh
        run: .\gradlew.bat build crystalAuraHarness --no-daemon
